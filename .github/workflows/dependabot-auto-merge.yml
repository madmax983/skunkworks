name: Enable automerge on dependabot PRs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: daneden/enable-automerge-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-author: madmax983
          merge-method: SQUASH
