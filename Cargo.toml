[workspace]
resolver = "2"
members = [ "alleles/*", "crates/*", "crates/arthropod", "experiments/*", "experiments/arthropod-flock", "experiments/arthropod-market", "experiments/chaos-hologram", "experiments/chimera-esolang", "experiments/chron-fluid", "experiments/ferrous-tank", "experiments/flock-market", "experiments/flock-physics", "experiments/flock-platter", "experiments/git-diffusion", "experiments/git-locus", "experiments/git-tank", "experiments/gray-lattice", "experiments/gray-miller", "experiments/market-poincare", "experiments/miller-origami", "experiments/myco-fluid", "experiments/myco-hologram", "experiments/myco-resonance", "experiments/myco-tank", "experiments/neuro-flock", "experiments/neuro-fluid", "experiments/neuro-market", "experiments/neuro-physics", "experiments/neuro-quipu", "experiments/neuro-strings", "experiments/origami-market", "experiments/origami-poincare", "experiments/physics-origami", "experiments/platter-market", "experiments/poincare-resonance", "experiments/quipu-flock", "experiments/quipu-locus", "experiments/quipu-market", "experiments/quipu-poincare", "graveyard/arthropod-lattice", "graveyard/hologram-tank", "graveyard/market-platter", "hyper_test", "experiments/arthropod-quipu", "experiments/arthropod-hyper", "experiments/hyper-neuro", "experiments/arthropod-mycelium"]
exclude = [ "graveyard/miller-locus", "graveyard/hyper-flock", "graveyard/ferrous-swarm", "graveyard/myco-reaper", "experiments/clockwork-chimera", "experiments/ik-codewalker", "experiments/system-turbulence", "experiments/verge-computer", "graveyard/*", "graveyard/chimera-genesis",]

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.28"
rand = "0.8"
ratatui = "0.30"
serde_json = "1.0"
git2 = "0.21"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies.arthropod]
path = "crates/arthropod"

[workspace.dependencies.locus]
path = "crates/locus"

[workspace.dependencies.ferrous-core]
path = "crates/ferrous-core"

[workspace.dependencies.platter]
path = "crates/platter"

[workspace.dependencies.git-associates]
path = "crates/git-associates"

[workspace.dependencies.gray-scott]
path = "crates/gray-scott"

[workspace.dependencies.market-sim]
path = "crates/market-sim"

[workspace.dependencies.origami]
path = "crates/origami"

[workspace.dependencies.poincare-disk]
path = "crates/poincare-disk"

[workspace.dependencies.quipu]
path = "crates/quipu"

[workspace.dependencies.resonance-audio]
path = "crates/resonance-audio"

[workspace.dependencies.tui-shared]
path = "crates/tui-shared"

[workspace.dependencies.hyper-system]
path = "crates/hyper-system"

[workspace.dependencies.flocking]
path = "crates/flocking"

[workspace.dependencies.chimera-lang]
path = "experiments/chimera-lang"

[patch.crates-io.bevy_reflect]
git = "https://github.com/bevyengine/bevy"
tag = "v0.14.2"
