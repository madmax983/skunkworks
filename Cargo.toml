[workspace]
resolver = "2"
members = [
    "crates/arthropod",
    "crates/*",
    "experiments/*",
    "alleles/*",
    "experiments/git-locus",
    "experiments/miller-origami",
    "experiments/git-poincare",
    "experiments/git-neuro",



    "experiments/chron-fluid",
    "experiments/myco-fluid",
    "experiments/chaos-hologram",
    "experiments/myco-tank",
    "experiments/ferrous-tank",
    "experiments/flock-platter",

    "experiments/myco-hologram",
    "experiments/git-diffusion",
    "experiments/git-tank",
    "experiments/neuro-flock",
    "experiments/neuro-fluid",

    "experiments/neuro-strings",
        "experiments/poincare-resonance",
    "experiments/physics-origami",

        "experiments/gray-lattice",
    "experiments/market-poincare",
    "graveyard/market-platter",
    "experiments/quipu-poincare",
    "experiments/quipu-locus",
    "experiments/myco-resonance",
    "experiments/quipu-flock",
    "experiments/flock-physics",
    "experiments/origami-poincare",
    "experiments/flock-market",
    "experiments/neuro-quipu",

    "experiments/quipu-market",
    "experiments/neuro-market",
    "experiments/neuro-physics",
    "experiments/arthropod-physics",
    "experiments/arthropod-lattice",
    "experiments/origami-market",
    "experiments/arthropod-flock",


]
exclude = [
    "graveyard/miller-locus",
    "graveyard/hyper-flock",
    "graveyard/ferrous-swarm",
    "graveyard/myco-reaper",
    "experiments/clockwork-chimera",

    "experiments/ik-codewalker",

    "experiments/system-turbulence",

    "experiments/verge-computer",
    "graveyard/*",
    "graveyard/chimera-genesis"
]

[workspace.dependencies]
arthropod = { path = "crates/arthropod" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
rand = "0.8"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
git2 = "0.21"
locus = { path = "crates/locus" }
ferrous-core = { path = "crates/ferrous-core" }
platter = { path = "crates/platter" }
git-associates = { path = "crates/git-associates" }
gray-scott = { path = "crates/gray-scott" }
market-sim = { path = "crates/market-sim" }
origami = { path = "crates/origami" }
poincare-disk = { path = "crates/poincare-disk" }
quipu = { path = "crates/quipu" }
resonance-audio = { path = "crates/resonance-audio" }
tui-shared = { path = "crates/tui-shared" }
hyper-system = { path = "crates/hyper-system" }
flocking = { path = "crates/flocking" }
# Add chimera-lang as it is likely used by others?
chimera-lang = { path = "experiments/chimera-lang" }
chaos-flock = { path = "experiments/chaos-flock" }
genetic-flock = { path = "experiments/genetic-flock" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
bevy_reflect = { git = "https://github.com/bevyengine/bevy", tag = "v0.14.2" }
