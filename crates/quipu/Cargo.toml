[package]
name = "quipu"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
anyhow = { workspace = true, optional = true }
crossbeam-channel = { version = "0.5", optional = true }
rand = { workspace = true, optional = true }

[dependencies.cpal]
version = "0.15"
optional = true

[features]
default = []
audio = ["dep:cpal", "dep:crossbeam-channel", "dep:rand", "dep:anyhow"]
[dev-dependencies]
proptest = "1.4.0"
