[package]
name = "tui-semantic"
version = "0.1.0"
edition = "2021"
description = "Semantic state bridge for TUI applications - lets LLMs understand and interact with terminal UIs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
locus = { workspace = true, features = ["serde"] }
