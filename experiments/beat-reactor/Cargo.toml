[package]
name = "beat-reactor"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
spectrum-analyzer = { version = "1.5", optional = true }
env_logger = "0.11"
log = "0.4"
rand = "0.8"
cpal = { version = "0.15", optional = true }

[features]
default = []
real_audio = ["cpal", "spectrum-analyzer"]
