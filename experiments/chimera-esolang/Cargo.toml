[package]
name = "chimera-esolang"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28"
rand = "0.8"
ratatui = "0.30"
serde_json = "1.0"
pest = "2.7"
pest_derive = "2.7"
comfy-table = "7.2.2"

[dependencies.chimera-lang]
workspace = true
features = [ "nova",]

[dependencies.anyhow]
workspace = true

[dependencies.clap]
version = "4.4"
features = [ "derive",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.tui-shared]
workspace = true

[dependencies.locus]
