[package]
name = "chimera-lang"
version = "0.1.0"
edition = "2021"

[features]
nova = []
cortex = []
biophysics = []
oracle = []
silicon = []
resonance = ["dep:resonance-audio", "dep:crossbeam-channel"]

[dependencies]
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.4", features = ["derive"] }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
rand = "0.8"
crossbeam-channel = { version = "0.5", optional = true }
resonance-audio = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
