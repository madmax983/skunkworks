[package]
name = "chimera-lang"
version = "0.1.0"
edition = "2021"
default-run = "chimera-lang"

[features]
default = ["nova", "oracle", "elektra"]
nova = ["oracle"]
cortex = []
biophysics = []
oracle = []
silicon = []
elektra = []
git = []
phylogeny = []
hive = []
resonance = ["dep:resonance-audio", "dep:crossbeam-channel", "dep:rodio"]

[dependencies]
regex = "1.10"
locus = { version = "0.1.0", path = "../../crates/locus", features = ["serde"] }
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
ratatui = "0.30"
tui-shared = { version = "0.1.0", path = "../../crates/tui-shared" }
crossterm = "0.28"
rand = "0.8"
crossbeam-channel = { version = "0.5", optional = true }
resonance-audio = { version = "0.1.0", path = "../../crates/resonance-audio", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.26"
strum_macros = "0.26"
poincare-disk = { version = "0.1.0", path = "../../crates/poincare-disk" }
origami = { version = "0.1.0", path = "../../crates/origami" }
comfy-table = "7.2.2"
rodio = { version = "0.17", optional = true }
hyper-system = { version = "0.1.0", path = "../../crates/hyper-system", default-features = false }
rustc-hash = "2.1.2"

[dev-dependencies]
loom = "0.7"
proptest = "1.4"
