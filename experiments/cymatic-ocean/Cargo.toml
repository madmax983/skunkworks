[package]
name = "cymatic-ocean"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.27"
anyhow = { workspace = true }
log = "0.4"
