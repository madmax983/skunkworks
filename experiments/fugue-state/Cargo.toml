[package]
name = "fugue-state"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
hound = "3.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[features]
nova = []
