[package]
name = "lexical-drift"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
rand = { workspace = true }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
unicode-segmentation = "1.10"
