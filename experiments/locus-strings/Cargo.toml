[package]
name = "locus-strings"
version = "0.1.0"
edition = "2021"

[dependencies]
flocking = { version = "0.1.0", path = "../../crates/flocking" }
locus = { path = "../../crates/locus" }
ferrous-core = { path = "../../crates/ferrous-core" }
macroquad = "0.4"
glam = "0.27"
rayon = "1.8"
rand = "0.8"
anyhow = "1.0"
crossbeam-channel = "0.5"
cpal = { version = "0.15", optional = true }

[features]
default = ["audio"]
audio = ["cpal"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
