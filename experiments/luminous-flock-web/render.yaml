services:
  - type: web
    name: luminous-flock
    runtime: static
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      source $HOME/.cargo/env
      rustup target add wasm32-unknown-unknown
      cargo install trunk
      trunk build --release
    staticPublishPath: ./dist
    envVars:
      - key: RUST_BACKTRACE
        value: 1
