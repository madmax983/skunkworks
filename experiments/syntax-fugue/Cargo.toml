[package]
name = "syntax-fugue"
version = "0.1.0"
edition = "2021"

[dependencies]
hound = "3.5"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
ratatui = { workspace = true }
crossterm = "0.27"
anyhow = "1.0"
rand = "0.8"

[dependencies.rodio]
version = "0.17"
optional = true

[features]
default = []
audio = ["dep:rodio"]
