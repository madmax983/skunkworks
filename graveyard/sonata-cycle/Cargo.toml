[package]
name = "sonata-cycle"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.13", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    # "bevy_audio", # Disabled by default to avoid alsa-sys
    "multi-threaded",
    "png",
    "hdr",
    "x11",
    "tonemapping_luts",
    "default_font",
    # "vorbis",
] }
bevy_rapier2d = "0.25"
bevy_prototype_lyon = "0.11"

[features]
default = []
audio = ["bevy/bevy_audio", "bevy/vorbis"]
