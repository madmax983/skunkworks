[package]
name = "thread-symphony"
version = "0.1.0"
edition = "2021"

[features]
default = ["audio"]
audio = ["dep:cpal"]
loom = ["dep:loom"]

[dependencies]
cpal = { version = "0.15", optional = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
crossbeam-channel = "0.5"
parking_lot = "0.12"
loom = { version = "0.7", optional = true }
