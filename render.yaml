services:
  - type: web
    runtime: static
    name: luminous-flock
    rootDir: experiments/luminous-flock-web
    buildCommand: |
      rustup target add wasm32-unknown-unknown &&
      cargo install --locked trunk &&
      trunk build --release
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - src/**
        - web/**
        - Cargo.toml
        - Trunk.toml
