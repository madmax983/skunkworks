services:
  - type: web
    runtime: static
    name: luminous-flock
    rootDir: experiments/luminous-flock-web
    buildCommand: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && . $HOME/.cargo/env && rustup target add wasm32-unknown-unknown && cargo install trunk && trunk build --release"
    staticPublishPath: ./dist
